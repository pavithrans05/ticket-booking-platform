services:

  backend:
    build:
      context: ./backend

    container_name: booking_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./frontend

    container_name: booking_frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app

    depends_on:
      - backend

  mysql:
    image: mysql:8.4

    container_name: booking_mysql

    restart: always

    environment:
      MYSQL_DATABASE: booking_db
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_password
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine

    container_name: booking_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: